[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
core_tools = { path = "../core_tools" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
base64 = "0.22"